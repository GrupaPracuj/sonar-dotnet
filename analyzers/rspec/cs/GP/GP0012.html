<p>
  Route segments should use kebab-case (lowercase words separated by hyphens), e.g. <code>job-offers</code> instead of
  <code>jobOffers</code>, <code>JobOffers</code> or <code>job_offers</code>.
</p>
<p>
  URLs are case-sensitive by convention and mixing casing styles across a service's endpoints makes the API inconsistent
  and harder to predict for clients.
</p>
